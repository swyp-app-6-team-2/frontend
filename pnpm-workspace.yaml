allowBuilds:
  '@firebase/util': false
  dooboolab-welcome: false
  protobufjs: false
  unrs-resolver: true
minimumReleaseAgeExclude:
  - expo-build-properties@57.0.21
nodeLinker: hoisted
# expo-constants 57.0.17 패치가 미출시 @expo/env@2.4.3를 참조해 설치가 깨진다.
# 프로젝트가 쓰는 57.0.10으로 핀 + @expo/env는 출시된 2.4.2로 고정.
overrides:
  expo-constants: 57.0.10
  '@expo/env': 2.4.2
  # expo-auth-session가 expo-linking@~57.0.9를 끌어와 루트 57.0.5와 중복 → 네이티브 모듈 중복.
  # 단일 버전으로 dedupe (expo-doctor 중복 체크 통과, EAS 로컬 빌드 setup 실패 방지).
  expo-linking: 57.0.9
